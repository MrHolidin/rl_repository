# v11_heroes + ADAPTIVE ENTROPY FLOOR (exploration-budget intervention).
#
# Measured across three independent 10M runs (control, attn3, tier-shaping) the
# entropy curve is IDENTICAL: 2.1 nats at 0.5M -> 1.2 at 2M -> 0.78 at 5M -> 0.61
# at 10M. Read against the legal action count -- 10.9 on average over 2539 real
# decisions, NOT the 64-wide head -- the ceiling is ln(10.9)=2.39, so the final
# policy picks among e^0.61 = 1.8 effective actions out of ~11.
#
# Those inflection points line up with the known saturation: the meta settles
# ~2M (entropy 1.2) and returns stop improving ~5M (entropy 0.78). Once the
# policy is that deterministic, any reward added later can only re-rank actions
# it already samples -- it cannot discover a new multi-round strategy. That is
# the common factor behind three interventions (DvD, RND, tier-shaping) each
# producing exactly the behaviour it paid for and no strength gain.
#
# entropy_target 1.2 nats = ~3.3 effective actions, roughly double the current
# spread and still far from the 10.9 of uniform-over-legal. The controller is
# ONE-SIDED: entropy_coef stays the floor, so the naturally high-entropy early
# phase is untouched and this can only add exploration relative to the baseline.
#
# READING THE RESULT: if entropy holds near 1.2 and strength still does not move
# against attn3, exploration budget is not the binding constraint and this whole
# branch can be closed -- which is worth as much as a win.
seed: 13

game:
  id: bglike
  params:
    seed: 13
    battle_damage_shaping: 0.0
    num_current_seats: 4
    patch_dir: data/bgcore/19_6_0_74257
    shop_excluded_count: 1
    obs_kind: bglike_v5_heroes
    with_heroes: true
    percent_high_game: 0.0

agent:
  id: ppo
  params:
    network_type: bglike_structured_v11_heroes
    observation_type: vector
    # Host-update acceleration: eager | compile (default) | capture.
    # "capture" = Phase-2 CUDA-graph capture (CUDA-only, ~1.66x update vs compile);
    # it auto-disables host torch.compile. env RL_UPDATE_OPT_MODE overrides.
    update_opt_mode: compile
    # --- DvD knobs neutralized: identities exist but carry no reward ---
    num_identities: 4
    diversity_coef: 0.0
    diversity_ema: 0.1
    identity_seed: 103
    # --- v11 architecture (2 entity-attn layers; flat clean trunk) ---
    slot_hidden_channels: 64
    card_emb_dim: 16
    entity_attention_layers: 2
    entity_attention_heads: 4
    entity_attention_ff_mult: 4
    entity_attention_init_scale: 0.1
    action_cross_attn_heads: 4
    action_cross_attn_ff_mult: 2
    action_cross_attn_init_scale: 0.1
    ability_emb_dim: 8
    state_dim: 128
    action_dim: 64
    order_hidden: 64
    order_pos_dim: 16
    summary_queries: 2
    thinking_blocks: 1
    thinking_hidden: 256
    economy_hidden: 64
    economy_out: 32
    combat_out: 16
    pending_ctx_out: 16
    # --- hero scalar encoder (new in v11_heroes) ---
    hero_hidden: 48
    hero_out: 24
    learning_rate: 0.0001
    discount_factor: 1.0
    gae_lambda: 0.99
    ppo_clip_eps: 0.2
    clip_value_loss: false
    value_clip_eps: null
    entropy_coef: 0.01        # floor; controller only raises from here
    entropy_target: 1.2       # nats; ~3.3 effective actions of ~10.9 legal
    entropy_coef_max: 0.2     # safety cap
    entropy_adapt_rate: 0.05  # multiplicative, per update
    value_coef: 0.05
    max_grad_norm: 1.0
    rollout_steps: 32768
    ppo_epochs: 4
    minibatch_size: 1024
    device: cuda

train:
  max_episodes: 10000000
  total_steps: 10000000
  deterministic: false
  track_timings: false
  start_policy: random
  opponent_sampler:
    type: pool
    params:
      seed: 103
      self_play:
        start_episode: 0
        max_frozen_agents: 15
        save_every: 1000
      scripted:
        mode: bglike
        distribution:
          t1_random: 1
          t_up_random: 1
          structured: 1
          random: 1
      league:
        rating:
          kind: trueskill
          trueskill:
            mu: 25.0
            sigma: 8.333
            beta: 4.167
            tau: 0.083
            draw_probability: 0.01
        sampler:
          kind: trueskill_quality
          current_self_fraction: 0.0
  callbacks:
    - type: checkpoint
      params:
        interval: 200000
        prefix: dist_bglike_ppo_v11_heroes_ent
    - type: metrics_file
      params:
        interval: 1

eval:
  enabled: false
  num_episodes: 100
  deterministic: true

distributed:
  workers: 40
  worker_device: cpu
