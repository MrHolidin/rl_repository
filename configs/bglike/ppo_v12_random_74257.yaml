# v12 CONTROL ARM — identical to ppo_v12_text_74257.yaml except that the text
# half of the frozen card table is replaced by a fixed random matrix of the same
# shape (card_text_mode: random, seeded by card_static_seed). The ability
# magnitudes, the obs, the architecture and every hyper-parameter are the same.
#
# Why it exists: v12 changes two things at once versus v11_heroes — where card
# facts come from (rules text instead of a learned id plus parsed ability
# tokens) and how they are laid out (a frozen static table instead of a
# per-observation block). This arm holds the layout fixed and destroys only the
# semantics. If the text arm beats this one, the text content is doing the work;
# if the two land together, the restructuring is, and the encoder is not needed.
seed: 13

game:
  id: bglike
  params:
    seed: 13
    battle_damage_shaping: 0.0
    num_current_seats: 4
    patch_dir: data/bgcore/19_6_0_74257
    shop_excluded_count: 1
    obs_kind: bglike_v6_heroes
    with_heroes: true
    percent_high_game: 0.0

agent:
  id: ppo
  params:
    network_type: bglike_structured_v12
    observation_type: vector
    update_opt_mode: compile
    # --- DvD knobs neutralized: identities exist but carry no reward ---
    num_identities: 4
    diversity_coef: 0.0
    diversity_ema: 0.1
    identity_seed: 103
    # --- frozen card table ---
    card_text_mode: random    # CONTROL ARM: same shape, no semantics
    card_text_dim: 32         # must match the artifact's --pca-dim
    card_static_seed: 0       # only used by card_text_mode=random
    # --- v11 architecture, unchanged ---
    slot_hidden_channels: 64
    entity_attention_layers: 2
    entity_attention_heads: 4
    entity_attention_ff_mult: 4
    entity_attention_init_scale: 0.1
    action_cross_attn_heads: 4
    action_cross_attn_ff_mult: 2
    action_cross_attn_init_scale: 0.1
    state_dim: 128
    action_dim: 64
    order_hidden: 64
    order_pos_dim: 16
    summary_queries: 2
    thinking_blocks: 1
    thinking_hidden: 256
    economy_hidden: 64
    economy_out: 32
    combat_out: 16
    pending_ctx_out: 16
    hero_hidden: 48
    hero_out: 24
    learning_rate: 0.0001
    discount_factor: 1.0
    gae_lambda: 0.99
    ppo_clip_eps: 0.2
    clip_value_loss: false
    value_clip_eps: null
    entropy_coef: 0.01
    value_coef: 0.05
    max_grad_norm: 1.0
    rollout_steps: 32768
    ppo_epochs: 4
    minibatch_size: 1024
    device: cuda

train:
  max_episodes: 10000000
  total_steps: 5000000
  deterministic: false
  track_timings: false
  start_policy: random
  opponent_sampler:
    type: pool
    params:
      seed: 103
      self_play:
        start_episode: 0
        max_frozen_agents: 15
        save_every: 1000
      scripted:
        mode: bglike
        distribution:
          t1_random: 1
          t_up_random: 1
          structured: 1
          random: 1
      league:
        rating:
          kind: trueskill
          trueskill:
            mu: 25.0
            sigma: 8.333
            beta: 4.167
            tau: 0.083
            draw_probability: 0.01
        sampler:
          kind: trueskill_quality
          current_self_fraction: 0.0
  callbacks:
    - type: checkpoint
      params:
        interval: 200000
        prefix: dist_bglike_ppo_v12_random
    - type: metrics_file
      params:
        interval: 1

eval:
  enabled: false
  num_episodes: 100
  deterministic: true

distributed:
  workers: 10
  worker_device: cpu
