# v11_heroes + TIER-MILESTONE SHAPING (tier curve intervention).
#
# Problem this targets: the trained policy stalls at tavern tier 4. Measured on
# dist_bglike_ppo_v11_heroes_9407129 over 30 lobbies: t4 at r7.3 but t5 only at
# r14.2 (35% of seats) and t6 at r16.8 (12%) -- roughly seven idle rounds at t4,
# while the shared pool's 189 t5 / 105 t6 copies sit untouched because every seat
# stalls at the same place.
#
# Diagnosis: the only reward in the episode is terminal placement, spread over
# ~105 actions per seat. Levelling costs gold now and pays off several rounds
# later, so the signal never survives the noise; entropy (~2.3 of ln(64)=4.16)
# keeps the policy stochastic per-action but never explores a multi-round
# strategic commitment. RND over own-board card counts made it worse (t5 8%),
# because board-composition novelty is farmable without leaving the trap.
#
# Intervention: a one-off, time-decayed bonus the first time a seat reaches t5/t6,
#     reward = base * decay ** max(0, round - target_round)
# Deliberately NOT potential-based (no terminal correction), so it DOES bias the
# optimum toward a faster curve -- training wheels, not a free lunch. The decay
# is what removes the degenerate "level at r18 to collect" line.
#
# Magnitudes: one placement position is 2/7 ~ 0.29 on the [-1,1] placement scale,
# and a badly-timed level can cost two. Bases are held well under that so the
# agent cannot profit by buying the bonus at the cost of its finish; the shaping
# wins on being immediate and noise-free, not on being large.
# Targets come from this sim's own economy (LEVEL_UP_COSTS with a 1/round
# discount): spending nothing on minions reaches t2/t3/t4/t5/t6 at r2/4/6/8/10 --
# the real-game 2-4-6 curve, extended. t5 target is that floor; t6 is set to r11
# rather than r10 because the second upgrade competes harder with buying.
#
# VALIDATION: after training, zero the bases and re-measure the curve. If it
# holds, the payoff was learned; if it snaps back to t4, the bonus was a crutch
# and the next step is a backward curriculum (high-tier starts).
seed: 13

game:
  id: bglike
  params:
    seed: 13
    battle_damage_shaping: 0.0
    num_current_seats: 4
    patch_dir: data/bgcore/19_6_0_74257
    shop_excluded_count: 1
    obs_kind: bglike_v5_heroes
    with_heroes: true
    # {tier: {base, target_round}} -- paid once per seat per lobby.
    tier_milestones:
      5: {base: 0.20, target_round: 8}
      6: {base: 0.15, target_round: 11}
    tier_milestone_decay: 0.8
    percent_high_game: 0.0

agent:
  id: ppo
  params:
    network_type: bglike_structured_v11_heroes
    observation_type: vector
    # Host-update acceleration: eager | compile (default) | capture.
    # "capture" = Phase-2 CUDA-graph capture (CUDA-only, ~1.66x update vs compile);
    # it auto-disables host torch.compile. env RL_UPDATE_OPT_MODE overrides.
    update_opt_mode: compile
    # --- DvD knobs neutralized: identities exist but carry no reward ---
    num_identities: 4
    diversity_coef: 0.0
    diversity_ema: 0.1
    identity_seed: 103
    # --- v11 architecture (2 entity-attn layers; flat clean trunk) ---
    slot_hidden_channels: 64
    card_emb_dim: 16
    entity_attention_layers: 2
    entity_attention_heads: 4
    entity_attention_ff_mult: 4
    entity_attention_init_scale: 0.1
    action_cross_attn_heads: 4
    action_cross_attn_ff_mult: 2
    action_cross_attn_init_scale: 0.1
    ability_emb_dim: 8
    state_dim: 128
    action_dim: 64
    order_hidden: 64
    order_pos_dim: 16
    summary_queries: 2
    thinking_blocks: 1
    thinking_hidden: 256
    economy_hidden: 64
    economy_out: 32
    combat_out: 16
    pending_ctx_out: 16
    # --- hero scalar encoder (new in v11_heroes) ---
    hero_hidden: 48
    hero_out: 24
    learning_rate: 0.0001
    discount_factor: 1.0
    gae_lambda: 0.99
    ppo_clip_eps: 0.2
    clip_value_loss: false
    value_clip_eps: null
    entropy_coef: 0.01
    value_coef: 0.05
    max_grad_norm: 1.0
    rollout_steps: 32768
    ppo_epochs: 4
    minibatch_size: 1024
    device: cuda

train:
  max_episodes: 10000000
  total_steps: 10000000
  deterministic: false
  track_timings: false
  start_policy: random
  opponent_sampler:
    type: pool
    params:
      seed: 103
      self_play:
        start_episode: 0
        max_frozen_agents: 15
        save_every: 1000
      scripted:
        mode: bglike
        distribution:
          t1_random: 1
          t_up_random: 1
          structured: 1
          random: 1
      league:
        rating:
          kind: trueskill
          trueskill:
            mu: 25.0
            sigma: 8.333
            beta: 4.167
            tau: 0.083
            draw_probability: 0.01
        sampler:
          kind: trueskill_quality
          current_self_fraction: 0.0
  callbacks:
    - type: checkpoint
      params:
        interval: 200000
        prefix: dist_bglike_ppo_v11_heroes_tiershape
    - type: metrics_file
      params:
        interval: 1

eval:
  enabled: false
  num_episodes: 100
  deterministic: true

distributed:
  workers: 40
  worker_device: cpu
