# v12 = v11_heroes with every card fact moved out of the observation and into a
# frozen per-card table: [ rules-text embedding | ability magnitudes ].
#
#   obs      bglike_v6_heroes = base(976) + hero(147) = 1123   (v5_heroes: 2683)
#   card     card_static[card_idx, is_golden] -> Linear -> slot encoder
#
# The 1560-float ability tail is gone: it re-encoded static card properties on
# every step. The text half is built once per patch by
#   python -m scripts.build_card_text_table --patch-dir data/bgcore/19_6_0_74257
# and lives at data/bgcore/19_6_0_74257/card_text_table.npz; the numeric half is
# read from the effect DSL at construction. Neither is trained.
#
# Run this together with ppo_v12_random_74257.yaml. That arm swaps the text half
# for a fixed random matrix of the same shape and is the control: without it a
# win over v11_heroes cannot be attributed to the *text* rather than to the
# restructuring. Compare both against v11_heroes on a common fixed reference
# (scripted bots + one shared frozen ladder), never on cross-run league ratings.
seed: 13

game:
  id: bglike
  params:
    seed: 13
    battle_damage_shaping: 0.0
    num_current_seats: 4
    patch_dir: data/bgcore/19_6_0_74257
    shop_excluded_count: 1
    obs_kind: bglike_v6_heroes
    with_heroes: true
    percent_high_game: 0.0
    # No shaping of any kind in this arm: the entropy-by-action-type columns
    # are the readout, and a reward term that fires on one card would be one
    # more thing moving while reading them.
    elemental_shop_bonus_shaping: 0.0
    elemental_shop_bonus_cap: 0

agent:
  id: ppo
  params:
    network_type: bglike_structured_v12
    observation_type: vector
    update_opt_mode: compile
    # --- DvD knobs neutralized: identities exist but carry no reward ---
    num_identities: 4
    diversity_coef: 0.0
    diversity_ema: 0.1
    identity_seed: 103
    # --- frozen card table ---
    card_text_mode: text      # "random" in the control arm
    card_text_dim: 32         # must match the artifact's --pca-dim
    card_static_seed: 0       # only used by card_text_mode=random
    # --- v11 architecture, unchanged ---
    slot_hidden_channels: 64
    entity_attention_layers: 2
    entity_attention_heads: 4
    entity_attention_ff_mult: 4
    entity_attention_init_scale: 0.1
    action_cross_attn_heads: 4
    action_cross_attn_ff_mult: 2
    action_cross_attn_init_scale: 0.1
    state_dim: 128
    action_dim: 64
    order_hidden: 64
    order_pos_dim: 16
    summary_queries: 2
    thinking_blocks: 1
    thinking_hidden: 256
    economy_hidden: 64
    economy_out: 32
    combat_out: 16
    pending_ctx_out: 16
    hero_hidden: 48
    hero_out: 24
    # 2.5x the 1e-4 the whole v12 line has used. The mb8k run moved very little
    # per update at 1e-4 (per-minibatch KL 0.002-0.005, clip_frac 0.01-0.06) and
    # its effective feature rank still fell 35 -> 21, so the step size is being
    # tested here rather than the batch. approx_kl_rollout is the column to
    # watch: it now reports the whole update's drift, not a per-minibatch mean.
    learning_rate: 0.00025
    discount_factor: 1.0
    gae_lambda: 0.99
    ppo_clip_eps: 0.2
    clip_value_loss: false
    value_clip_eps: null
    entropy_coef: 0.02
    # One-sided floor on exploration: entropy_coef is only ever raised (up to
    # entropy_coef_max) while measured entropy sits under the target, never
    # lowered. v12_text_40w fell 2.17 -> 0.81 and spent its last third there,
    # so 1.0 is set just above where that run flattened out.
    entropy_target: 1.0
    value_coef: 0.05
    max_grad_norm: 3.0
    rollout_steps: 32768
    ppo_epochs: 4
    # 8x the sibling arm's 1024. Everything else identical, learning rate
    # included, so the only thing that moved is gradient steps per update:
    # 32768 / 8192 * 4 epochs = 16, down from 128.
    minibatch_size: 8192
    device: cuda

train:
  max_episodes: 20000000
  total_steps: 20000000
  deterministic: false
  track_timings: false
  start_policy: random
  opponent_sampler:
    type: pool
    params:
      seed: 103
      self_play:
        start_episode: 0
        max_frozen_agents: 15
        save_every: 1000
      scripted:
        mode: bglike
        distribution:
          t1_random: 1
          t_up_random: 1
          structured: 1
          planner: 1
          random: 1
      league:
        rating:
          kind: trueskill
          trueskill:
            mu: 25.0
            sigma: 8.333
            beta: 4.167
            tau: 0.083
            draw_probability: 0.01
        sampler:
          kind: trueskill_quality
          current_self_fraction: 0.0
  callbacks:
    - type: checkpoint
      params:
        # 500k over 20M steps: 40 files, ~225 MB, instead of the 100 that 200k
        # would leave. Saves land on update boundaries, so each is within a
        # rollout (~33k steps) of the round number.
        interval: 500000
        prefix: dist_bglike_ppo_v12_lr25
    - type: metrics_file
      params:
        interval: 1

eval:
  enabled: false
  num_episodes: 100
  deterministic: true

distributed:
  workers: 40
  worker_device: cpu
